<script>
"use strict";
/* ================= তথ্য ================= */
var DAYS=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];

var MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
var T1="৬:০০–৭:৩০ AM",T2="৮:০০–৯:৩০ AM",T3="১০:০০–১১:৩০ AM",T4="২:৩০–৩:১৫ PM",T5="৪:০০–৫:১৫ PM",T6="৮:৩০–১০:০০ PM";
var NIGHT=[T6,"রাতের রিভিশন","দিনের যতটুকু পড়া হয়েছে রিভিশন মুখস্ত।","r"];
var PLAN={
 "শনিবার":{sub:"বাংলা - গণিত",rows:[[T1,"বাংলা","","n"],[T2,"গণিত","","n"],[T3,"বাংলা + গণিত","নতুন শেখা বিষয়ের অনুশীলন।","n"],[T4,"আগের দিনের রিভিশন","শুক্রবারের পড়া।","r"],[T5,"টাইপিং","বাংলা + ইংরেজি টাইপিং।","s"],NIGHT]},
 "রবিবার":{sub:"ইংরেজি - সাধারণ জ্ঞান",rows:[[T1,"ইংরেজি","","n"],[T2,"সাধারণ জ্ঞান","","n"],[T3,"ইংরেজি + সাধারণ জ্ঞান","","n"],[T4,"শনিবারের বাংলা গণিত রিভিশন","এখানে নতুন করে পড়বে না—নিজেকে পরীক্ষা করবে।","r"],[T5,"MS Word","","s"],NIGHT]},
 "সোমবার":{sub:"গণিত - বাংলা",rows:[[T1,"গণিত","","n"],[T2,"বাংলা","","n"],[T3,"গণিত + বাংলা","","n"],[T4,"রবিবারের ইংরেজি + সাধারণ জ্ঞান রিভিশন","","r"],[T5,"ইংরেজি টাইপিং + বাংলা টাইপিং","","s"],NIGHT]},
 "মঙ্গলবার":{sub:"ইংরেজি - সাধারণ জ্ঞান",rows:[[T1,"ইংরেজি","","n"],[T2,"সাধারণ জ্ঞান","","n"],[T3,"ইংরেজি + সাধারণ জ্ঞান","","n"],[T4,"সোমবারের গণিত + বাংলা রিভিশন","","r"],[T5,"MS Excel","","s"],NIGHT]},
 "বুধবার":{sub:"বাংলা - গণিত",rows:[[T1,"বাংলা","","n"],[T2,"গণিত","","n"],[T3,"বাংলা + গণিত","","n"],[T4,"মঙ্গলবারের ইংরেজি + সাধারণ জ্ঞান রিভিশন","","r"],[T5,"কম্পিউটার","গুরুত্বপূর্ণ Shortcut/Abbreviation","s"],NIGHT]},
 "বৃহস্পতিবার":{sub:"ইংরেজি - সাধারণ জ্ঞান",rows:[[T1,"ইংরেজি","","n"],[T2,"সাধারণ জ্ঞান","","n"],[T3,"English + সাধারণ জ্ঞান","","n"],[T4,"বুধবারের বাংলা + গণিত রিভিশন","","r"],[T5,"কম্পিউটার","MS Office/Email/Office কাজ","s"],NIGHT]},
 "শুক্রবার":{sub:"সাপ্তাহিক রিভিশন",rows:[[T1,"বাংলা","সাপ্তাহিক পূর্ণ রিভিশন","r"],[T2,"ইংরেজি","সাপ্তাহিক পূর্ণ রিভিশন","r"],[T3,"গণিত","সাপ্তাহিক পূর্ণ রিভিশন","r"],[T4,"সাধারণ জ্ঞান","সাপ্তাহিক পূর্ণ রিভিশন","r"],[T5,"Typing Test","নির্দিষ্ট সময় ধরে বাংলা ও ইংরেজি টাইপিং।","s"],[T6,"পরের সপ্তাহের প্রস্তুতি + পুরো সপ্তাহের ভুলের খাতা","","r"]]}
};
var TYPE={n:["নতুন পড়া","b-n"],r:["রিভিশন","b-r"],s:["দক্ষতা","b-s"]};
var SUBJECTS=["বাংলা","ইংরেজি","গণিত","সাধারণ জ্ঞান","কম্পিউটার"];
var SUBHINT={"বাংলা":"ব্যাকরণ (সন্ধি, সমাস, কারক-বিভক্তি, বাগধারা, বানান, প্রবাদ), সাহিত্য","ইংরেজি":"Grammar, Vocabulary, Right form of verb, Synonyms/Antonyms, Translation","গণিত":"পাটিগণিত (শতকরা, অনুপাত-সমানুপাত, লাভ-ক্ষতি, সুদকষা, গড়, সময়-কাজ), প্রাথমিক বীজগণিত ও জ্যামিতি","সাধারণ জ্ঞান":"বাংলাদেশ ও আন্তর্জাতিক বিষয়াবলি, ইতিহাস, ভূগোল, সাধারণ বিজ্ঞান (সাম্প্রতিক ঘটনা বাদ)","কম্পিউটার":"কম্পিউটার ও ICT, MS Word/Excel, শর্টকাট, Abbreviation, ইন্টারনেট/ইমেইল"};

/* ================= সহায়ক ================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function num(x){return bn(Math.round(x*100)/100)}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function today(){return new Date()}
function dayName(d){return DAYS[d.getDay()]}
function fmtDate(k){var d=parseKey(k);return bn(d.getDate())+" "+MONTHS[d.getMonth()]+" "+bn(d.getFullYear())}
function fmtTime(ts){var d=new Date(ts),h=d.getHours(),m=d.getMinutes();return bn(h%12||12)+":"+bn(String(m).padStart(2,"0"))+(h<12?" AM":" PM")}
function fmtDur(sec){var m=Math.floor(sec/60),s=sec%60;return bn(m)+" মি. "+bn(s)+" সে."}
function countOpts(cur,max,step){var a=[0],i;for(i=step;i<=max;i+=step)a.push(i);if(a.indexOf(cur)<0){a.push(cur);a.sort(function(x,y){return x-y})}return a.map(function(n){return '<option value="'+n+'"'+(n===cur?" selected":"")+'>'+bn(n)+'</option>'}).join("")}
function stepsTo(max,min){var a=[];for(var i=min||5;i<=max;i+=5)a.push(i);return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ================= অবস্থা ও সংরক্ষণ ================= */
var KEY2="studyPlannerV2",KEY1="studyPlannerV1",DK="studyExamDetail_";
function blank(){return {v:2,startDate:"2026-10-08",pattern:"",checks:{},logs:{},exams:[],updated:0}}
var S=blank();
var dbc=null,dirty={meta:false,days:{},exams:{},del:{}},saveTimer=null;

function fromV1(x){
  var o=blank();o.pattern=x.pattern||"";o.logs=x.logs||{};o.updated=x.updated||Date.now();
  Object.keys(x.checks||{}).forEach(function(d){o.checks[d]={};Object.keys(x.checks[d]).forEach(function(i){if(x.checks[d][i])o.checks[d][i]=1})});
  (x.quizzes||[]).forEach(function(q,i){o.exams.push({id:"old"+i,date:q.date,at:0,kind:"practice",label:q.subject,qtype:"mcq",total:q.total,max:q.total,score:q.score,correct:q.score,wrong:q.total-q.score,skipped:0,neg:0,usedSec:0,hasDetail:false})});
  return o;
}
function loadLocal(){
  try{
    var r=localStorage.getItem(KEY2);
    if(r){S=Object.assign(blank(),JSON.parse(r));return}
    var o=localStorage.getItem(KEY1);
    if(o){S=fromV1(JSON.parse(o))}
  }catch(e){}
}
function saveLocal(){try{localStorage.setItem(KEY2,JSON.stringify(S))}catch(e){}}
function persist(){S.updated=Date.now();saveLocal();dirty.meta=true;sched()}
function markDay(k){dirty.days[k]=1}
function sched(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
function getLocalDetail(id){try{var r=localStorage.getItem(DK+id);return r?JSON.parse(r):null}catch(e){return null}}
function putDetail(id,det){try{localStorage.setItem(DK+id,JSON.stringify(det))}catch(e){}dirty.exams[id]=1}
async function flush(){
  if(!dbc)return;
  var d=dirty;dirty={meta:false,days:{},exams:{},del:{}};
  var base="data/users/"+dbc.id+"/";
  try{
    if(d.meta)await dbc.db.doc(base+"meta").set({json:JSON.stringify({v:2,startDate:S.startDate,pattern:S.pattern,exams:S.exams.slice(-300),updated:S.updated})});
    for(var k in d.days){
      var c=S.checks[k],l=S.logs[k],empty=(!c||!Object.keys(c).length)&&(!l||!l.length);
      var ref=dbc.db.doc(base+"days/"+k);
      if(empty){try{await ref.delete()}catch(e){}}else await ref.set({date:k,json:JSON.stringify({checks:c||{},logs:l||[]})});
    }
    for(var id in d.exams){var det=getLocalDetail(id);if(det)await dbc.db.doc(base+"exams/"+id).set({json:JSON.stringify(det)})}
    for(var id2 in d.del){try{await dbc.db.doc(base+"exams/"+id2).delete()}catch(e){}}
  }catch(e){
    dirty.meta=dirty.meta||d.meta;

}

        snap.docs.forEach(function(ds){try{var dd=JSON.parse(ds.data().json);if(dd.checks&&Object.keys(dd.checks).length)checks[ds.id]=dd.checks;if(dd.logs&&dd.logs.length)logs[ds.id]=dd.logs}catch(e){}});
        S=Object.assign(blank(),{startDate:m.startDate||S.startDate,pattern:m.pattern||"",exams:m.exams||[],checks:checks,logs:logs,updated:m.updated});
        saveLocal();render();
      }else if((S.updated||0)>(m.updated||0)){pushAll()}

      var ls=await db.doc(base+"state").get();
      if(!S.updated&&ls.exists){try{S=fromV1(JSON.parse(ls.data().json));saveLocal();render()}catch(e){}}

function dayInfo(d){var rows=PLAN[dayName(d)].rows,c=S.checks[dkey(d)]||{},n=0;for(var i=0;i<rows.length;i++)if(c[i])n++;return {n:n,total:rows.length}}
function streak(){
  var d=today(),cnt=0,x=dayInfo(d);
  if(!(dkey(d)>=S.startDate&&x.n===x.total))d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){if(dkey(d)<S.startDate)break;var y=dayInfo(d);if(y.n===y.total){cnt++;d.setDate(d.getDate()-1)}else break}
  return cnt;
}
function attendance(){
  var out=[],t=today(),tk=dkey(t),d=parseKey(S.startDate),full=0,part=0,none=0;
  if(S.startDate>tk)return {list:out,full:0,part:0,none:0,days:0};
  for(var i=0;i<800&&dkey(d)<=tk;i++){
    var k=dkey(d),x=dayInfo(d),st;
    if(x.n===x.total)st="full";else if(k===tk)st=x.n?"part":"live";else st=x.n?"part":"none";
    if(st==="full")full++;else if(st==="part"&&k!==tk)part++;else if(st==="none")none++;
    out.push({k:k,name:dayName(d),n:x.n,total:x.total,st:st,logs:(S.logs[k]||[]).length});
    d.setDate(d.getDate()+1);
  }
  return {list:out.reverse(),full:full,part:part,none:none,days:out.length};
}

function makeCfg(marks,qtype){
  var w=[3,3,3,3,2],tot=14,c={},s=0,i;
  for(i=0;i<5;i++){c[SUBJECTS[i]]=Math.floor(marks*w[i]/tot);s+=c[SUBJECTS[i]]}
  for(i=0;s<marks;i=(i+1)%5){c[SUBJECTS[i]]++;s++}
  var counts={};
  SUBJECTS.forEach(function(x){counts[x]=qtype==="mcq"?c[x]:Math.max(1,Math.round(c[x]/5))});
  return {marks:marks,qtype:qtype,min:qtype==="mcq"?marks:Math.round(marks*90/70),neg:0.25,counts:counts};
}
function cfgTotal(){var t=0;SUBJECTS.forEach(function(x){t+=cfg.counts[x]||0});return t}

  }
  /* অনুশীলন */
  run.qs.forEach(function(q,i){h+=qCard(q,i,run)});
  if(run.qtype==="mcq"&&answered===total&&run.rec){h+=resultCard(run.rec,run.det)}
  if(run.qtype==="written"&&run.rec){h+=resultCard(run.rec,run.det)}
  h+='<button class="btn alt" id="qclr">এই পরীক্ষা সরিয়ে ফেলুন</button>';
  return h;
}
function qCard(q,i,run){
  var h='<div class="card q"><h3>'+bn(i+1)+'. '+(q.subject?'<span class="badge b-s">'+esc(q.subject)+'</span> ':'')+esc(q.q)+(run.qtype==="written"?' <span class="small">['+bn(q.marks)+' নম্বর]</span>':'')+'</h3>';
  if(run.qtype==="mcq"){
    var a=run.ans[i],has=a!==undefined,exam=run.kind==="exam";
    q.options.forEach(function(o,j){
      var cls="opt";
      if(exam){if(a===j)cls+=" sel"}else if(has){if(j===q.answer)cls+=" ok";else if(j===a)cls+=" bad"}
      h+='<button class="'+cls+'" data-q="'+i+'" data-o="'+j+'"'+((!exam&&has)?" disabled":"")+'>'+esc(o)+'</button>';
    });
    if(exam&&has)h+='<button class="link g" data-clrq="'+i+'">উত্তর মুছুন</button>';
    if(!exam&&has&&q.explain)h+='<div class="exp">ব্যাখ্যা: '+esc(q.explain)+'</div>';
  }else{
    var w=run.wr[i]||{text:""};
    h+='<textarea data-w="'+i+'" placeholder="এখানে নিজের উত্তর লিখুন" '+(w.res?"readonly":"")+'>'+esc(w.text)+'</textarea>';
    if(run.kind==="practice"){
      if(!w.res)h+='<button class="btn alt" data-chk="'+i+'"'+(w.loading?" disabled":"")+'>'+(w.loading?"যাচাই হচ্ছে…":"উত্তর যাচাই করুন")+'</button>'+(w.err?'<div class="msg">'+esc(w.err)+'</div>':'');
      else h+='<div class="msg ok">প্রাপ্ত নম্বর: '+bn(w.res.score)+' / '+bn(q.marks)+'</div><div class="exp"><b>মন্তব্য:</b> '+esc(w.res.feedback)+'</div>'+(w.res.missing?'<div class="exp"><b>যা বাদ পড়েছে:</b> '+esc(w.res.missing)+'</div>':'')+'<div class="exp"><b>আদর্শ উত্তর:</b> '+esc(q.model)+'</div>';
    }
  }
  return h+'</div>';
}
function resultCard(rec,det){
  var h='<div class="card" style="text-align:center"><div class="h">ফলাফল</div><div class="big">'+num(rec.score)+' / '+num(rec.max)+'</div>';
  if(rec.qtype==="mcq")h+='<div class="small">সঠিক '+bn(rec.correct)+' • ভুল '+bn(rec.wrong)+' • উত্তর দেননি '+bn(rec.skipped)+(rec.neg?' • কাটা −'+num(rec.neg):'')+'</div>';
  if(rec.usedSec)h+='<div class="small">সময় লেগেছে '+fmtDur(rec.usedSec)+'</div>';
  if(det&&det.bys){h+='<div style="text-align:left;margin-top:10px">';Object.keys(det.bys).forEach(function(s){var b=det.bys[s];h+='<div class="r7"><div class="grow">'+esc(s)+'</div><div class="small">'+(det.qtype==="mcq"?'সঠিক '+bn(b.c)+' • ভুল '+bn(b.w)+' • বাদ '+bn(b.s):num(b.got)+'/'+num(b.max))+'</div></div>'});h+='</div>'}
  return h+'<div class="small" style="margin-top:8px">এই ফলাফল “অগ্রগতি” ট্যাবে সংরক্ষিত আছে। সেখান থেকে ভুলগুলো আবার দেখা যাবে।</div></div>';
}
function reviewList(det,wrongOnly){
  var h="";if(!det)return '<div class="card"><div class="empty">এই পরীক্ষার বিস্তারিত সংরক্ষিত নেই।</div></div>';
  det.qs.forEach(function(q,i){
    if(det.qtype==="mcq"){
      var a=det.ans[i],bad=(a!==q.answer);
      if(wrongOnly&&!bad)return;
      h+='<div class="card q"><h3>'+bn(i+1)+'. '+(q.subject?'<span class="badge b-s">'+esc(q.subject)+'</span> ':'')+esc(q.q)+' '+(a===undefined?'<span class="badge b-r">উত্তর দেননি</span>':bad?'<span class="badge b-bad">ভুল</span>':'<span class="badge b-ok">সঠিক</span>')+'</h3>';
      q.options.forEach(function(o,j){var cls="opt";if(j===q.answer)cls+=" ok";else if(j===a)cls+=" bad";h+='<div class="'+cls+'" style="cursor:default">'+esc(o)+(j===a?' <span class="small">(আপনার উত্তর)</span>':'')+'</div>'});
      if(q.explain)h+='<div class="exp">ব্যাখ্যা: '+esc(q.explain)+'</div>';
      h+='</div>';
    }else{
      var w=det.wr[i]||{text:"",score:0},low=w.score<q.marks*0.6;
      if(wrongOnly&&!low)return;
      h+='<div class="card q"><h3>'+bn(i+1)+'. '+(q.subject?'<span class="badge b-s">'+esc(q.subject)+'</span> ':'')+esc(q.q)+' <span class="small">['+bn(w.score)+'/'+bn(q.marks)+']</span></h3>'+
         '<div class="exp"><b>আপনার উত্তর:</b> '+esc(w.text||"(লেখেননি)")+'</div>'+(w.feedback?'<div class="exp"><b>মন্তব্য:</b> '+esc(w.feedback)+'</div>':'')+(w.missing?'<div class="exp"><b>যা বাদ পড়েছে:</b> '+esc(w.missing)+'</div>':'')+'<div class="exp"><b>আদর্শ উত্তর:</b> '+esc(q.model)+'</div></div>';
    }
  });
  return h||'<div class="card"><div class="empty">দেখানোর মতো কিছু নেই — সবগুলো ঠিক ছিল 🎉</div></div>';
}

function timeLeftSec(){var r=quiz.run;return Math.max(0,Math.round((r.startAt+r.durSec*1000-Date.now())/1000))}
function timeLeftText(){var s=timeLeftSec(),m=Math.floor(s/60);return bn(m)+":"+bn(String(s%60).padStart(2,"0"))}
function startTimer(){
  stopTimer();
  timerId=setInterval(function(){
    var r=quiz.run;if(!r||r.kind!=="exam"||r.submitted){stopTimer();return}
    var el=document.getElementById("tleft"),bar=document.getElementById("timerbar"),s=timeLeftSec();
    if(el)el.textContent=timeLeftText();
    if(bar)bar.classList.toggle("low",s<=300);
    if(s<=0){stopTimer();submitExam(true)}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

/* ---------- রেকর্ড সংরক্ষণ ও মোছা ---------- */
function newId(){return "e"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36)}
function saveRecord(rec,det){
  S.exams.push(rec);
  if(S.exams.length>300)S.exams=S.exams.slice(-300);
  putDetail(rec.id,det);
  var withD=S.exams.filter(function(e){return e.hasDetail});
  while(withD.length>30){var o=withD.shift();o.hasDetail=false;try{localStorage.removeItem(DK+o.id)}catch(e){}dirty.del[o.id]=1}
  persist();
}
function deleteExam(id){
  S.exams=S.exams.filter(function(e){return e.id!==id});
  try{localStorage.removeItem(DK+id)}catch(e){}
  dirty.del[id]=1;delete dirty.exams[id];persist();
}
async function openReview(id){
  review={id:id,det:null,loading:true,wrongOnly:false};tab="review";render();window.scrollTo(0,0);
  var e=S.exams.filter(function(x){return x.id===id})[0];
  review.det=(e&&e.hasDetail)?await getDetail(id):null;review.loading=false;render();
}
function backupJSON(){var det={};S.exams.forEach(function(e){var d=getLocalDetail(e.id);if(d)det[e.id]=d});return "\uFEFF"+JSON.stringify({S:S,details:det},null,1)}

function buildText(){
  var L=["মো. আবু শাহিদ — স্টাডি প্ল্যানার (আমার নোট)","তৈরি: "+fmtDate(dkey(today())),""],seen={},ds=[];
  Object.keys(S.logs).concat(Object.keys(S.checks)).forEach(function(k){if(!seen[k]){seen[k]=1;ds.push(k)}});
  ds.sort().reverse().forEach(function(k){
    var x=dayInfo(parseKey(k));
    L.push("■ "+fmtDate(k)+" ("+dayName(parseKey(k))+") — সম্পন্ন সেশন: "+bn(x.n)+"/"+bn(x.total));
    (S.logs[k]||[]).forEach(function(e){L.push("• "+e.s+": "+e.t)});
    L.push("");
  });
  L.push("— পরীক্ষার ফলাফল —");
  S.exams.slice().reverse().forEach(function(e){L.push(fmtDate(e.date)+" | "+e.label+" | "+num(e.score)+"/"+num(e.max))});
  return L.join("\n");
}
function doText(){backupSave("amar-note-"+dkey(today())+".txt","\uFEFF"+buildText(),document.getElementById("bkmsg"),"text/plain")}
function doRestore(f){
  var m=document.getElementById("bkmsg");if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{
    var o=JSON.parse(String(r.result).replace(/^\uFEFF/,"")),X=o.S||o;if(!X||typeof X!=="object"||!X.checks)throw 0;
    S=(X.v===2)?Object.assign(blank(),X):fromV1(X);
    Object.keys(o.details||{}).forEach(function(id){try{localStorage.setItem(DK+id,JSON.stringify(o.details[id]))}catch(e){}});
    S.updated=Date.now();saveLocal();pushAll();render();
  }catch(e){m.textContent="ফাইলটি সঠিক ব্যাকআপ নয়।"}};
  r.readAsText(f);
}

var BASE="তুমি বাংলাদেশের সরকারি চাকরির নিয়োগ পরীক্ষার অভিজ্ঞ প্রশ্নকারী। পরীক্ষার্থী “অফিস সহকারী কাম কম্পিউটার মুদ্রাক্ষরিক” (১৬তম গ্রেড) পদের জন্য প্রস্তুতি নিচ্ছে। প্রশ্নের মান বাংলাদেশের এই গ্রেডের নিয়োগ পরীক্ষার মতো (বেসিক থেকে মাঝারি) হবে। উত্তর অবশ্যই নির্ভুল হতে হবে; গণিত ধাপে ধাপে হিসাব করে নিশ্চিত করবে; নিশ্চিত না হলে সেই প্রশ্ন দেবে না।";
var FMT_MCQ="\n\nনিয়ম: প্রতিটি প্রশ্নে ঠিক ৪টি অপশন, একটিই সঠিক। বাংলা বিষয়ে বাংলায়, ইংরেজি বিষয়ে ইংরেজিতে প্রশ্ন। explain-এ ১ বাক্যে ব্যাখ্যা।\nশুধু JSON array ফেরত দাও: [{\"subject\":\"বিষয়\",\"q\":\"প্রশ্ন\",\"options\":[\"ক\",\"খ\",\"গ\",\"ঘ\"],\"answer\":0,\"explain\":\"ব্যাখ্যা\"}] — answer হলো সঠিক অপশনের ইনডেক্স (০ থেকে ৩)।";
var FMT_WR="\n\nনিয়ম: প্রতিটি প্রশ্ন ২–৫ বাক্যে উত্তরযোগ্য (যেমন সংজ্ঞা, ব্যাখ্যা, অনুবাদ, ব্যাকরণ, সংক্ষিপ্ত রচনা, গাণিতিক সমস্যা), marks সবসময় ৫। model-এ আদর্শ উত্তর দাও।\nশুধু JSON array ফেরত দাও: [{\"subject\":\"বিষয়\",\"q\":\"প্রশ্ন\",\"marks\":5,\"model\":\"আদর্শ উত্তর\"}]";

  else if(code==="rate_limited")t=IS_GEMINI?"Gemini-র ফ্রি সীমা আপাতত শেষ। কিছুক্ষণ পর আবার চেষ্টা করুন, অথবা “AI ছাড়া অনুশীলন” ব্যবহার করুন।":"আপনার Claude-এর ব্যবহারের সীমা শেষ হয়ে থাকতে পারে। কিছুক্ষণ পর আবার চেষ্টা করুন, অথবা “AI ছাড়া অনুশীলন” ব্যবহার করুন।";

  else if(code==="images_unavailable")t="এই ভিউতে ছবি পাঠানো যাচ্ছে না। Claude অ্যাপের ভেতর থেকে খুলে চেষ্টা করুন, অথবা লিখে জমা দিন।";
  else if(code==="image_rejected")t="ছবিটি পড়া যায়নি। অন্য ছবি দিন (JPG/PNG)।";
  else t="এই মুহূর্তে কাজটি করা যায়নি। একটু পরে আবার চেষ্টা করুন।";
  return t+(detail?"\n[কারিগরি তথ্য: "+detail+"]":"");
}
function normMcq(arr){return (Array.isArray(arr)?arr:((arr&&arr.questions)||[])).filter(function(x){return x&&typeof x.q==="string"&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4})}
function normWr(arr){return (Array.isArray(arr)?arr:((arr&&arr.questions)||[])).filter(function(x){return x&&typeof x.q==="string"&&typeof x.model==="string"}).map(function(x){x.marks=5;return x})}
function patternNote(){return (S.pattern&&S.pattern.trim())?"\n\nপরীক্ষার্থীর সার্কুলারের পরীক্ষা-পদ্ধতি (এই ধরন মাথায় রেখে প্রশ্ন করো):\n"+S.pattern.trim():""}

async function startQuiz(){
  quiz.err="";var qt=quiz.qtype,signal;
  var sample=await getSample();
  if(!sample){quiz.err="এই পেজটি Claude অ্যাপ/claude.ai-তে সাইন ইন অবস্থায় খুললে প্রশ্ন তৈরির সুবিধা পাওয়া যাবে।";render();return}
  var nm=qt==="mcq"?"বহুনির্বাচনি (MCQ)":"সংক্ষিপ্ত লিখিত";
  quiz.ctl=new AbortController();signal=quiz.ctl.signal;
  try{
    var qs=[];
    if(quiz.mode==="practice"){
      var topics=topicsFor(quiz.period,quiz.subject);
      if(!topics.length){quiz.err="এই সময়ে/বিষয়ে কোনো পড়া জমা দেওয়া নেই। আগে “আজ কী পড়লাম” ট্যাবে জমা দিন।";render();return}
      var spec="পরীক্ষার্থী আজ ঠিক এইটুকুই পড়েছে:\n\"\"\"\n"+topics.join("\n")+"\n\"\"\"\n\nকঠোর নিয়ম: "+bn(quiz.count)+"টি "+nm+" প্রশ্ন তৈরি করো, কিন্তু শুধু উপরের লেখায় যে নিয়ম, সংজ্ঞা, শব্দ, উদাহরণ ও তথ্য স্পষ্টভাবে আছে সেগুলো থেকে। লেখার বাইরের কোনো নিয়ম, ধরন, উদাহরণ বা অধ্যায়ের অন্য অংশ থেকে প্রশ্ন করা যাবে না (যেমন শুধু স্বরসন্ধি পড়ে থাকলে ব্যঞ্জনসন্ধি বা বিসর্গসন্ধির প্রশ্ন নয়)। লেখায় শুধু বিষয়ের নাম থাকলে এবং অংশ নির্দিষ্ট না থাকলে সবচেয়ে মৌলিক ও সংজ্ঞাভিত্তিক প্রশ্ন দাও। সঠিক উত্তর যেন পরীক্ষার্থী ওই লেখা থেকেই বের করতে পারে।"+patternNote();
      quiz.loading=true;
      var left=quiz.count,chunks=[];while(left>0){chunks.push(Math.min(left,20));left-=20}
      for(var ci=0;ci<chunks.length;ci++){
        quiz.prog="প্রশ্ন বানানো হচ্ছে… ("+bn(ci+1)+"/"+bn(chunks.length)+")";render();
        var before=qs.map(function(x){return "- "+String(x.q).slice(0,60)}).join("\n");
        var sp=spec.replace(bn(quiz.count)+"টি",bn(chunks[ci])+"টি")+(chunks.length>1||quiz.count>10?"\n\nলেখাটি ছোট হলে অর্থহীন পুনরাবৃত্তি না করে যতগুলো ভালো প্রশ্ন সম্ভব ততগুলোই দাও।":"")+(before?"\n\nএই প্রশ্নগুলো আগেই করা হয়েছে, এগুলোর পুনরাবৃত্তি করবে না:\n"+before:"");
        var data=await sample.json(BASE+"\n\n"+sp+(qt==="mcq"?FMT_MCQ:FMT_WR),{signal:signal,cache:false});
        qs=qs.concat(qt==="mcq"?normMcq(data):normWr(data));
      }
      qs=qs.slice(0,quiz.count);
      if(!qs.length)throw {code:"upstream_error",detail:"উত্তরের কাঠামো ঠিক নেই"};
      quiz.run={kind:"practice",qtype:qt,qs:qs,ans:{},wr:{},saved:false};
    }else{
      var tot=cfgTotal();
      if(!tot){quiz.err="অন্তত একটি বিষয়ে প্রশ্নের সংখ্যা দিন।";render();return}
      quiz.loading=true;var step=0,subs=SUBJECTS.filter(function(x){return cfg.counts[x]>0});
      for(var s=0;s<subs.length;s++){
        var sb=subs[s],c=cfg.counts[sb];step++;quiz.prog="প্রশ্ন বানানো হচ্ছে… ("+bn(step)+"/"+bn(subs.length)+": "+sb+")";render();
        var chunks=[];while(c>0){chunks.push(Math.min(c,20));c-=20}
        for(var k=0;k<chunks.length;k++){
          var prevq=qs.filter(function(x){return x.subject===sb}).map(function(x){return "- "+String(x.q).slice(0,60)}).join("\n");
          var sp="বিষয়: "+sb+" ("+SUBHINT[sb]+")। এই বিষয় থেকে একটি বাস্তব নিয়োগ পরীক্ষার মতো "+bn(chunks[k])+"টি "+nm+" প্রশ্ন তৈরি করো। প্রশ্নগুলো বিভিন্ন টপিক থেকে হবে, পুনরাবৃত্তি থাকবে না। subject ফিল্ডে \""+sb+"\" লিখবে।"+patternNote()+(prevq?"\n\nএই প্রশ্নগুলো আগেই করা হয়েছে, পুনরাবৃত্তি করবে না:\n"+prevq:"");
          var dd=await sample.json(BASE+"\n\n"+sp+(qt==="mcq"?FMT_MCQ:FMT_WR),{signal:signal,cache:false});
          var part=qt==="mcq"?normMcq(dd):normWr(dd);
          if(!part.length)throw {code:"upstream_error",detail:sb+": উত্তরের কাঠামো ঠিক নেই"};
          part.forEach(function(x){x.subject=sb});qs=qs.concat(part);
        }
      }
      shuffle(qs);
      quiz.run={kind:"exam",qtype:qt,qs:qs,ans:{},wr:{},startAt:Date.now(),durSec:cfg.min*60,neg:cfg.neg,submitted:false};
      armed="";
    }
  }catch(e){quiz.err=errText(e&&e.code,e&&e.detail);quiz.run=null}
  quiz.loading=false;quiz.ctl=null;quiz.prog="";render();window.scrollTo(0,0);
}

function onOpt(i,o){
  var r=quiz.run;if(!r)return;
  r.ans[i]=o;
  if(r.kind==="practice"&&Object.keys(r.ans).length===r.qs.length&&!r.saved){
    var res=scoreMcq(r),rec={id:newId(),date:dkey(today()),at:Date.now(),kind:"practice",label:quiz.subject==="সব"?"আমার পড়া":quiz.subject,qtype:"mcq",total:r.qs.length,max:r.qs.length,score:r.qs.length?res.correct:0,correct:res.correct,wrong:res.wrong,skipped:0,neg:0,usedSec:0,hasDetail:true};
    var det={qtype:"mcq",negRate:0,qs:r.qs,ans:r.ans,wr:{},bys:res.bys,usedSec:0};
    saveRecord(rec,det);r.saved=true;r.rec=rec;r.det=det;
  }
  keepScroll();
}
function scoreMcq(r){
  var c=0,w=0,sk=0,bys={};
  r.qs.forEach(function(q,i){var a=r.ans[i],sub=q.subject||"সব";bys[sub]=bys[sub]||{c:0,w:0,s:0};
    if(a===undefined){sk++;bys[sub].s++}else if(a===q.answer){c++;bys[sub].c++}else{w++;bys[sub].w++}});
  var neg=Math.round(w*(r.neg||0)*100)/100;
  return {correct:c,wrong:w,skipped:sk,neg:neg,final:Math.round((c-neg)*100)/100,bys:bys};
}
async function evalWritten(sample,items,signal){
  var p=BASE+"\n\nনিচের লিখিত প্রশ্নগুলোর পরীক্ষার্থীর উত্তর মূল্যায়ন করো। ন্যায্যভাবে নম্বর দাও (০ থেকে পূর্ণমান, পূর্ণসংখ্যা); খালি বা অপ্রাসঙ্গিক উত্তরে ০।\n\n";
  items.forEach(function(it,i){p+="প্রশ্ন "+i+": "+it.q+"\nপূর্ণমান: "+it.marks+"\nআদর্শ উত্তর: "+it.model+"\nপরীক্ষার্থীর উত্তর: "+(it.text&&it.text.trim()?it.text:"(লেখেনি)")+"\n\n"});
  p+="শুধু JSON array ফেরত দাও, প্রতিটি প্রশ্নের জন্য একটি: [{\"i\":0,\"score\":0,\"feedback\":\"২–৩ বাক্যে মন্তব্য\",\"missing\":\"কী বাদ পড়েছে (না থাকলে খালি)\"}]";
  var r=await sample.json(p,{signal:signal,cache:false});
  var arr=Array.isArray(r)?r:((r&&r.results)||[]);
  return items.map(function(it,i){var x=arr.filter(function(y){return +y.i===i})[0]||arr[i]||{};
    return {score:Math.max(0,Math.min(it.marks,Math.round(+x.score||0))),feedback:String(x.feedback||""),missing:String(x.missing||"")}});
}
async function checkWritten(i){

    if(r.qs.every(function(x,j){return r.wr[j]&&r.wr[j].res})&&!r.saved){
      var got=0,max=0,bys={};r.qs.forEach(function(x,j){var s=r.wr[j].res.score;got+=s;max+=x.marks;var b=bys[x.subject||"সব"]=bys[x.subject||"সব"]||{got:0,max:0};b.got+=s;b.max+=x.marks});
      var rec={id:newId(),date:dkey(today()),at:Date.now(),kind:"practice",label:(quiz.subject==="সব"?"আমার পড়া":quiz.subject)+" (লিখিত)",qtype:"written",total:r.qs.length,max:max,score:got,correct:0,wrong:0,skipped:0,neg:0,usedSec:0,hasDetail:true};
      var wr={};r.qs.forEach(function(x,j){wr[j]={text:r.wr[j].text,score:r.wr[j].res.score,feedback:r.wr[j].res.feedback,missing:r.wr[j].res.missing}});
      var det={qtype:"written",qs:r.qs,ans:{},wr:wr,bys:bys,usedSec:0};

async function submitExam(auto){
  var r=quiz.run;if(!r||r.submitted||r.grading)return;
  stopTimer();

    var res=scoreMcq(r);
    rec={id:newId(),date:dkey(today()),at:Date.now(),kind:"exam",label:"বাস্তব পরীক্ষা (MCQ)",qtype:"mcq",total:r.qs.length,max:r.qs.length,score:res.final,correct:res.correct,wrong:res.wrong,skipped:res.skipped,neg:res.neg,usedSec:used,hasDetail:true};
    det={qtype:"mcq",negRate:r.neg,qs:r.qs,ans:r.ans,wr:{},bys:res.bys,usedSec:used};
  }else{
    var sample=await getSample();

    r.grading=true;r.err="";render();
    try{
      var items=r.qs.map(function(q,i){return {q:q.q,marks:q.marks,model:q.model,text:(r.wr[i]&&r.wr[i].text)||""}}),out=[];
      for(var a=0;a<items.length;a+=7){var part=await evalWritten(sample,items.slice(a,a+7));out=out.concat(part)}
      var got=0,max=0,bys={},wr={};
      r.qs.forEach(function(q,i){var o=out[i];got+=o.score;max+=q.marks;var b=bys[q.subject||"সব"]=bys[q.subject||"সব"]||{got:0,max:0};b.got+=o.score;b.max+=q.marks;wr[i]={text:items[i].text,score:o.score,feedback:o.feedback,missing:o.missing}});
      rec={id:newId(),date:dkey(today()),at:Date.now(),kind:"exam",label:"বাস্তব পরীক্ষা (লিখিত)",qtype:"written",total:r.qs.length,max:max,score:got,correct:0,wrong:0,skipped:0,neg:0,usedSec:used,hasDetail:true};
      det={qtype:"written",qs:r.qs,ans:{},wr:wr,bys:bys,usedSec:used};
    }catch(e){r.grading=false;r.err=errText(e&&e.code,e&&e.detail)+"\n(আপনার উত্তর হারায়নি, আবার জমা দিন।)";render();return}
    r.grading=false;
  }
  saveRecord(rec,det);r.submitted=true;r.rec=rec;r.det=det;render();window.scrollTo(0,0);
}

/* ---------- AI ছাড়া অনুশীলন ---------- */
function startCloze(){
  var es=entriesFor(quiz.period,quiz.subject);
  if(!es.length){quiz.err="এই সময়ে/বিষয়ে কোনো পড়া জমা দেওয়া নেই।";render();return}
  var sents=[];
  es.forEach(function(e){String(e.t).split(/[\n।\.\?!;]+/).forEach(function(x){x=x.trim();if(x.split(/\s+/).length>=5&&x.length>=25)sents.push(x)})});
  if(!sents.length){quiz.err="লেখাগুলো থেকে কার্ড বানানোর মতো পূর্ণ বাক্য পাওয়া যায়নি। কয়েকটি পূর্ণ বাক্যে নোট লিখে জমা দিন।";render();return}
  shuffle(sents);var cards=[];
  sents.slice(0,quiz.count).forEach(function(x){
    var words=x.split(/\s+/),cand=[];
    words.forEach(function(w,i){var c=w.replace(/^[^\wঀ-৿]+|[^\wঀ-৿]+$/g,"");if(c.length>=3&&!/^[\d০-৯.,:+=\-]+$/.test(c))cand.push({i:i,c:c})});
    if(!cand.length)return;
    cand.sort(function(a,b){return b.c.length-a.c.length});
    var pick=cand[Math.floor(Math.random()*Math.min(3,cand.length))];
    var w2=words.slice();w2[pick.i]=w2[pick.i].replace(pick.c,"_____");
    cards.push({text:w2.join(" "),ans:pick.c,show:false,res:null});
  });
  if(!cards.length){quiz.err="কার্ড বানানো যায়নি।";render();return}
  quiz.err="";quiz.run={kind:"cloze",cards:cards};render();window.scrollTo(0,0);
}

async function scanPhotos(files,autoSave){
  scan.err="";
  if(!files||!files.length){scan.err="আগে একটি ছবি বেছে নিন।";render();return}
  var sample=await getSample();
  if(!sample){scan.err="এই পেজটি Claude অ্যাপ/claude.ai-তে সাইন ইন অবস্থায় খুললে ছবি পড়ার সুবিধা পাওয়া যাবে।";render();return}
  var lim=null;try{lim=await sample.limits()}catch(e){}
  if(!lim||!lim.images){scan.err=errText("images_unavailable");render();return}
  var arr=Array.prototype.slice.call(files,0,Math.min(3,lim.images.maxCount));
  scan.loading=true;scan.ctl=new AbortController();render();
  try{
    var r=await sample.json("ছবিতে একটি বইয়ের পৃষ্ঠা (বা স্ক্রিনশট) আছে। পৃষ্ঠার লেখা পড়ে পরীক্ষার্থীর পড়ার রেকর্ডের জন্য মূল বিষয়, সংজ্ঞা, সূত্র, তথ্য ও উদাহরণগুলো গুছিয়ে বাংলায় লেখো (ইংরেজি পাঠ্য হলে ইংরেজি শব্দ/বাক্য যেমন আছে তেমন রাখো)। লেখা পাঠের স্বাভাবিক ক্রমে সাজাও: একাধিক কলাম বা বাক্স থাকলে উপর থেকে নিচে, বাম থেকে ডানে, শিরোনাম আগে; পাশের বা নিচের টীকা/উদাহরণ সংশ্লিষ্ট অংশের সঙ্গে রাখো। শুধু ছবিতে যা আছে তা-ই লেখো, নিজে কিছু যোগ করো না; ঝাপসা অংশ বাদ দাও। সর্বোচ্চ ২৫০০ অক্ষর। শুধু JSON: {\"subject\":\"বাংলা|ইংরেজি|গণিত|সাধারণ জ্ঞান|কম্পিউটার — এর একটি\",\"summary\":\"লেখা\"}",{images:arr,signal:scan.ctl.signal,cache:false});
    if(!r||!r.summary)throw {code:"upstream_error",detail:"ছবি থেকে লেখা পাওয়া যায়নি"};
    if(SUBJECTS.indexOf(r.subject)>=0)logDraft.s=r.subject;
    logDraft.t=(logDraft.t?logDraft.t+"\n\n":"")+String(r.summary);
    if(autoSave){var k=dkey(today());S.logs[k]=S.logs[k]||[];S.logs[k].push({s:logDraft.s,t:logDraft.t,at:Date.now()});logDraft={s:logDraft.s,t:""};logMsg="ছবি পড়ে জমা হয়েছে ✓ নিচের তালিকায় দেখে নিন।";markDay(k);persist()}
  }catch(e){scan.err=errText(e&&e.code,e&&e.detail)}
  scan.loading=false;scan.ctl=null;render();
}

var IS_GEMINI=true;
var GBASE="https://generativelanguage.googleapis.com/v1beta/";
var GFALL=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash","gemini-flash-latest","gemini-flash-lite-latest"];
function gKey(){try{return localStorage.getItem("geminiKey")||""}catch(e){return ""}}
function gSaved(){try{return localStorage.getItem("geminiModel")||""}catch(e){return ""}}
function shrink(f){return new Promise(function(res){
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var m=1800,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.85).split(",")[1])};
  img.onerror=function(){URL.revokeObjectURL(u);res(null)};img.src=u})}
async function gFetch(url,opt){try{return await fetch(url,opt)}catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};throw {code:"network",detail:String((e&&e.message)||e)}}}
async function errInfo(resp){var m="";try{var j=await resp.json();m=(j.error&&j.error.message)||""}catch(e){}return resp.status+": "+m.slice(0,200)}
var GEM={
  limits:async function(){return {images:{maxCount:3}}},
  json:async function(prompt,o){
    o=o||{};var key=gKey();if(!key)throw {code:"no_key"};
    var parts=[{text:prompt}];
    if(o.images){for(var i=0;i<o.images.length;i++){var b=await shrink(o.images[i]);if(!b)throw {code:"image_rejected"};parts.push({inline_data:{mime_type:"image/jpeg",data:b}})}}
    var models=[],sv=gSaved();if(sv)models.push(sv);
    GFALL.forEach(function(m){if(models.indexOf(m)<0)models.push(m)});
    var last=null;
    for(var j=0;j<models.length;j++){
      var m=models[j];
      var resp=await gFetch(GBASE+"models/"+encodeURIComponent(m)+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:parts}],generationConfig:{responseMimeType:"application/json",temperature:0.4}}),signal:o.signal});
      if(resp.ok){
        var d=await resp.json(),t="";
        try{t=d.candidates[0].content.parts.map(function(p){return p.text||""}).join("")}catch(e){last={code:"upstream_error",detail:m+": খালি উত্তর"};continue}
        try{var out=JSON.parse(String(t).replace(/```json|```/g,"").trim());try{localStorage.setItem("geminiModel",m)}catch(e){}return out}
        catch(e){last={code:"upstream_error",detail:m+": উত্তরের JSON বোঝা যায়নি"};continue}
      }
      var info=await errInfo(resp),st=resp.status;
      if(st===401||st===403||(st===400&&/API key|API_KEY/i.test(info)))throw {code:"bad_key",detail:info};
      last={code:st===429?"rate_limited":"upstream_error",detail:m+" → "+info};
    }
    throw last||{code:"upstream_error"};
  }
};

async function gDetect(setMsg){
  var key=gKey();
  var r;try{r=await gFetch(GBASE+"models?pageSize=200&key="+encodeURIComponent(key),{})}catch(e){setMsg("✗ "+errText(e.code,e.detail));return}
  if(!r.ok){setMsg("✗ কী যাচাই হয়নি — "+await errInfo(r));return}
  var j=await r.json(),names=(j.models||[]).filter(function(m){return (m.supportedGenerationMethods||[]).indexOf("generateContent")>=0}).map(function(m){return m.name.replace(/^models\//,"")});
  var pick=null;
  GFALL.forEach(function(x){if(!pick&&names.indexOf(x)>=0)pick=x});
  if(!pick)names.forEach(function(x){if(!pick&&/flash/.test(x)&&!/image|tts|live|audio|thinking|embed/.test(x))pick=x});
  if(!pick){setMsg("✗ আপনার কী-তে ব্যবহারযোগ্য Gemini মডেল পাওয়া যায়নি।");return}
  try{localStorage.setItem("geminiModel",pick)}catch(e){}
  setMsg("কী ঠিক আছে। মডেল: "+pick+"\nএকটি ছোট টেস্ট চলছে…");
  try{await GEM.json('শুধু JSON দিন: {"ok":true}',{});setMsg("✓ সব ঠিক আছে। মডেল: "+pick)}
  catch(e){setMsg("কী ঠিক, কিন্তু টেস্ট ব্যর্থ:\n"+errText(e&&e.code,e&&e.detail))}
}
